<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Code Secret</title>

<link rel="icon" type="image/png" href="web/console-de-jeu.png">

<style>
body{
    text-align:center;
    font-family:Arial;
    margin-top:50px;
}
body {
    background-image: url("../fond.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

input,button{
    font-size:20px;
    padding:10px;
}
h1{
        font-size:60px;
        text-shadow:0 0 15px cyan;
    }
#message{
    font-size:24px;
    margin-top:20px;
}
#historique{
    width:min(520px,90%);
    margin:25px auto;
    display:grid;
    gap:10px;
}
.tentative{
    display:grid;
    grid-template-columns:80px 1fr 1fr;
    gap:12px;
    padding:12px 16px;
    border:1px solid rgba(0,255,255,.55);
    border-radius:14px;
    background:rgba(4,25,38,.88);
    color:white;
}
</style>

<link rel="stylesheet" href="ui-commune.css">
<script src="ui-commune.js"></script>
</head>
<body>

<h1>🔐 Code Secret</h1>

<p>Trouve le code à 4 chiffres !</p>

<input id="proposition" maxlength="4" inputmode="numeric" autocomplete="off" placeholder="0000">

<button onclick="verifier()">Valider</button>

<p id="message"></p>

<div id="historique" aria-live="polite"></div>

<script>

let code = "";

for(let i=0;i<4;i++){
    code += Math.floor(Math.random()*10);
}

const propositionInput = document.getElementById("proposition");
const historique = document.getElementById("historique");

function verifier(){

    let proposition = propositionInput.value;

    let message =
        document.getElementById("message");

    if(!/^\d{4}$/.test(proposition)){
        message.textContent =
        "❌ Tu dois entrer exactement 4 chiffres";
        return;
    }

    let bien_places = 0;
    const codeRestant = [];
    const propositionRestante = [];

    for(let i=0;i<4;i++){
        if(proposition[i] === code[i]){
            bien_places++;
        } else {
            codeRestant.push(code[i]);
            propositionRestante.push(proposition[i]);
        }
    }

    let mal_places = 0;
    for(const chiffre of propositionRestante){
        const position = codeRestant.indexOf(chiffre);
        if(position !== -1){
            mal_places++;
            codeRestant.splice(position,1);
        }
    }

    const ligne = document.createElement("div");
    ligne.className = "tentative";
    ligne.innerHTML = `<strong>${proposition}</strong><span>✅ ${bien_places} bien placé${bien_places !== 1 ? "s" : ""}</span><span>🟡 ${mal_places} mal placé${mal_places !== 1 ? "s" : ""}</span>`;
    historique.prepend(ligne);
    propositionInput.value = "";
    propositionInput.focus();

    if(bien_places == 4){

        message.innerHTML =
        "🎉 Bravo ! Le code était : " + code;

    }else{

        message.innerHTML =
        "✅ Bien placés : " + bien_places +
        "<br>🟡 Mal placés : " + mal_places;
    }
}

</script>
</body>
</html>
