<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Détective — Le Mystère du Manoir</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at top,#173a4a,#070d18 68%);text-align:center}button,select{font:inherit}.hidden{display:none!important}header{padding:72px 16px 14px}h1{margin:0;font-size:clamp(38px,7vw,76px);text-shadow:0 0 14px #00f5ff,0 0 34px #00f5ff88}header p{max-width:720px;margin:8px auto;color:#d8f8ff}.layout{width:min(1200px,95%);margin:12px auto 35px;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.75fr);gap:18px}.panel{padding:20px;border:1px solid #00f5ff66;border-radius:24px;background:#071521e8}.status{display:flex;justify-content:space-between;gap:10px;margin-bottom:15px}.badge{padding:9px 13px;border-radius:999px;background:#ffffff10}.scene{min-height:190px;display:grid;place-items:center;padding:22px;border-radius:20px;background:linear-gradient(145deg,#163344,#10152b);border:1px solid #67efff55}.scene-icon{font-size:74px;margin:0}.scene h2{margin:5px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.action{min-height:112px;padding:13px;color:#fff;border:1px solid #00eaff77;border-radius:17px;background:linear-gradient(145deg,#123549,#18213c);font-weight:bold}.action span{display:block;font-size:34px}.notebook{text-align:left}.notebook h2{text-align:center}.note-group{margin:12px 0;padding:11px;border-radius:15px;background:#ffffff09}.note-group h3{margin:0 0 8px;color:#75f6ff}.note-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}.note{padding:7px;border-radius:9px;background:#ffffff08}.note.eliminated{color:#91a5ae;text-decoration:line-through}.clues{max-height:220px;overflow:auto;padding:9px;border-radius:13px;background:#020b12}.clue{margin:7px;padding:8px;border-left:3px solid #00f5ff;background:#ffffff08}.accuse{padding:18px}.accuse-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.accuse label{display:grid;gap:6px;text-align:left}.accuse select{padding:11px;color:#fff;background:#102b3a;border:1px solid #00eaff88;border-radius:11px}.primary,.secondary{margin-top:14px;padding:12px 18px;border-radius:13px;color:#fff;font-weight:bold}.primary{border:0;background:linear-gradient(135deg,#00a9c2,#6154d8)}.secondary{border:1px solid #ffffff44;background:#ffffff10}.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;background:#02070def}.modal{width:min(650px,96%);padding:28px;border:2px solid #00f5ff;border-radius:25px;background:linear-gradient(145deg,#0b2534,#151329)}.big{font-size:82px;margin:0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{padding:12px;color:#fff;border:1px solid #00eaff66;border-radius:12px;background:#ffffff0d}.choice.eliminated{opacity:.4;text-decoration:line-through}@media(max-width:850px){.layout{grid-template-columns:1fr}.actions,.accuse-grid{grid-template-columns:1fr}}@media(max-width:520px){.note-list,.choices{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="ui-commune.css"><script src="ui-commune.js"></script></head><body>
<header><h1>🕵️ LE MYSTÈRE DU MANOIR</h1><p>Découvre qui a dérobé le Saphir d’Aurore, dans quelle pièce et avec quel objet.</p></header>
<main class="layout"><section class="panel"><div class="status"><div class="badge">⏳ Actions : <span id="turns">12</span></div><div class="badge">💡 Indices : <span id="clueCount">0</span></div></div><div class="scene"><div><p id="sceneIcon" class="scene-icon">🏚️</p><h2 id="sceneTitle">Une nuit au manoir</h2><p id="sceneText">Le célèbre saphir a disparu. Tous les invités sont suspects.</p></div></div><div class="actions"><button class="action" id="questionBtn"><span>🗣️</span>Interroger un suspect</button><button class="action" id="searchBtn"><span>🔍</span>Fouiller une pièce</button><button class="action" id="objectBtn"><span>🧪</span>Examiner un objet</button></div><section class="accuse"><h2>⚖️ Accusation finale</h2><div class="accuse-grid"><label>Le coupable<select id="suspectSelect"></select></label><label>La pièce<select id="roomSelect"></select></label><label>L’objet<select id="objectSelect"></select></label></div><button id="accuseBtn" class="primary">Faire mon accusation</button></section></section><aside class="panel notebook"><h2>📓 Carnet d’enquête</h2><div id="notes"></div><h3>Indices recueillis</h3><div id="clues" class="clues"><p>Aucun indice.</p></div><button id="restart" class="secondary">🔄 Nouvelle enquête</button></aside></main>
<div id="choiceOverlay" class="overlay hidden"><div class="modal"><p id="choiceIcon" class="big"></p><h2 id="choiceTitle"></h2><div id="choices" class="choices"></div><button id="cancelChoice" class="secondary">Annuler</button></div></div><div id="resultOverlay" class="overlay hidden"><div class="modal"><p id="resultIcon" class="big"></p><h2 id="resultTitle"></h2><p id="resultText"></p><button id="again" class="primary">Nouvelle enquête</button><button id="continueBtn" class="secondary hidden">Continuer</button></div></div>
<script>
const SUSPECTS=["Alba Morel","Basile Roche","Céleste Dorian","Nino Valmont","Rose Delcourt","Victor Lune"],ROOMS=["Bibliothèque","Cuisine","Jardin d’hiver","Grand salon","Atelier","Observatoire"],OBJECTS=["Chandelier","Clé ancienne","Canne sculptée","Loupe dorée","Cordelette","Statue de hibou"],$=id=>document.getElementById(id);let mystery,turns,eliminated,clues,finished;const pick=list=>list[Math.floor(Math.random()*list.length)];const safe=value=>value.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[c]);
function fill(select,list){select.innerHTML='<option value="">Choisir…</option>'+list.map(x=>`<option>${safe(x)}</option>`).join("")}function scene(icon,title,text){$("sceneIcon").textContent=icon;$("sceneTitle").textContent=title;$("sceneText").textContent=text}function addClue(text){if(!clues.includes(text))clues.unshift(text)}function eliminate(type,value,text){eliminated[type].add(value);addClue(text)}
function newGame(){mystery={suspect:pick(SUSPECTS),room:pick(ROOMS),object:pick(OBJECTS)};turns=12;clues=[];finished=false;eliminated={suspect:new Set(),room:new Set(),object:new Set()};fill($("suspectSelect"),SUSPECTS);fill($("roomSelect"),ROOMS);fill($("objectSelect"),OBJECTS);$("resultOverlay").classList.add("hidden");$("choiceOverlay").classList.add("hidden");scene("🏚️","Une nuit au manoir","Le Saphir d’Aurore a disparu. Interroge, fouille et examine avant d’accuser.");update()}
function update(){$("turns").textContent=turns;$("clueCount").textContent=clues.length;const groups=[["suspect","Suspects",SUSPECTS],["room","Pièces",ROOMS],["object","Objets",OBJECTS]];$("notes").innerHTML=groups.map(([type,title,list])=>`<section class="note-group"><h3>${title}</h3><div class="note-list">${list.map(x=>`<div class="note ${eliminated[type].has(x)?"eliminated":""}">${safe(x)}</div>`).join("")}</div></section>`).join("");$("clues").innerHTML=clues.length?clues.map(x=>`<div class="clue">${safe(x)}</div>`).join(""):"<p>Aucun indice.</p>";["questionBtn","searchBtn","objectBtn","accuseBtn"].forEach(id=>$(id).disabled=finished||turns<=0)}
function choose(type){if(finished||turns<=0)return;const config={suspect:["🗣️","Qui interroger ?",SUSPECTS],room:["🔍","Quelle pièce fouiller ?",ROOMS],object:["🧪","Quel objet examiner ?",OBJECTS]}[type];$("choiceIcon").textContent=config[0];$("choiceTitle").textContent=config[1];$("choices").innerHTML="";config[2].forEach(value=>{let b=document.createElement("button");b.className="choice"+(eliminated[type].has(value)?" eliminated":"");b.textContent=value;b.onclick=()=>investigate(type,value);$("choices").appendChild(b)});$("choiceOverlay").classList.remove("hidden")}
function investigate(type,value){$("choiceOverlay").classList.add("hidden");let text;if(type==="suspect")value===mystery.suspect?(text=`${value} hésite et change de version. Cette personne reste suspecte.`,addClue(text),scene("😰",`Interrogatoire de ${value}`,text)):(text=`Un témoin confirme l’alibi de ${value}.`,eliminate(type,value,text),scene("✅","Alibi vérifié",text));if(type==="room")value===mystery.room?(text=`Des traces prouvent que le voleur est passé par ${value}.`,addClue(text),scene("👣","Traces découvertes",text)):(text=`Aucune trace du vol dans ${value}.`,eliminate(type,value,text),scene("🚫","Pièce écartée",text));if(type==="object")value===mystery.object?(text=`${value} porte une poussière bleue identique à celle du socle.`,addClue(text),scene("✨","Preuve matérielle",text)):(text=`L’analyse confirme que ${value} n’a pas servi pendant le vol.`,eliminate(type,value,text),scene("🧼","Objet innocenté",text));turns--;update();if(turns<=0&&!finished)end(false,"Le temps est écoulé avant ton accusation.")}
function accuse(){const guess={suspect:$("suspectSelect").value,room:$("roomSelect").value,object:$("objectSelect").value};if(!guess.suspect||!guess.room||!guess.object)return scene("⚠️","Accusation incomplète","Choisis un suspect, une pièce et un objet.");if(guess.suspect===mystery.suspect&&guess.room===mystery.room&&guess.object===mystery.object)return end(true,"Ton raisonnement est parfait : le mystère est résolu !");turns-=2;update();if(turns<=0)return end(false,"Ta dernière accusation était incorrecte et le coupable a pris la fuite.");$("resultIcon").textContent="❌";$("resultTitle").textContent="Mauvaise accusation";$("resultText").textContent="Au moins un élément est faux. Cette erreur coûte deux actions.";$("again").classList.add("hidden");$("continueBtn").classList.remove("hidden");$("resultOverlay").classList.remove("hidden")}
function end(won,reason){finished=true;update();$("resultIcon").textContent=won?"🏆":"🌑";$("resultTitle").textContent=won?"Affaire résolue !":"Enquête terminée";$("resultText").innerHTML=`${safe(reason)}<br><br><b>Solution :</b><br>${safe(mystery.suspect)}, dans ${safe(mystery.room)}, avec ${safe(mystery.object)}.`;$("again").classList.remove("hidden");$("continueBtn").classList.add("hidden");$("resultOverlay").classList.remove("hidden")}
$("questionBtn").onclick=()=>choose("suspect");$("searchBtn").onclick=()=>choose("room");$("objectBtn").onclick=()=>choose("object");$("cancelChoice").onclick=()=>$("choiceOverlay").classList.add("hidden");$("accuseBtn").onclick=accuse;$("continueBtn").onclick=()=>$("resultOverlay").classList.add("hidden");$("again").onclick=newGame;$("restart").onclick=()=>confirm("Commencer une nouvelle enquête ?")&&newGame();newGame();
</script></body></html>
