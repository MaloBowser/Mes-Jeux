<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Fruit Slice</title>
<style>*{box-sizing:border-box;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07151d;font-family:Arial}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}.hidden{display:none!important}.screen{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#174b48dd,#030a0ff5)}.panel{width:min(650px,92%);padding:30px;text-align:center;color:#fff;background:#071820dd;border:1px solid #ffffff26;border-radius:28px;box-shadow:0 20px 70px #000}h1{font-size:clamp(48px,10vw,90px);margin:0;color:#91ff87;text-shadow:0 0 15px #4cff5b,4px 5px #173b1b}h2{font-size:45px}p{font-size:18px;line-height:1.5}button{border:0;border-radius:18px;padding:15px 28px;margin:8px;font-size:21px;font-weight:bold;color:#fff;background:linear-gradient(#39b94d,#197629);box-shadow:0 7px #0c4818;cursor:pointer}button:active{transform:translateY(5px);box-shadow:0 2px #0c4818}.record{font-size:25px;color:#ffe65a;font-weight:bold}#hud{position:fixed;z-index:3;left:0;right:0;top:0;padding:18px 22px;display:flex;justify-content:space-between;color:white;font-size:28px;font-weight:bold;text-shadow:2px 3px 4px #000;pointer-events:none}.heart{color:#ff4b5f}#combo{position:fixed;z-index:4;left:50%;top:25%;transform:translate(-50%,-50%);font-size:55px;font-weight:900;color:#ffe65a;text-shadow:0 0 12px #ff8c00;opacity:0;pointer-events:none}#combo.pop{animation:pop .7s}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}70%{opacity:1}100%{opacity:0}}</style></head>
<body><a href="../index.html" aria-label="Retourner à l’accueil" title="Accueil" style="position:fixed;z-index:20;top:12px;left:12px;width:52px;height:52px;display:grid;place-items:center;border:2px solid #00f5ff;border-radius:50%;background:#071820e8;color:#fff;text-decoration:none;font-size:27px;box-shadow:0 0 18px #00f5ff88">🏠</a><canvas id="c"></canvas><div id="hud" class="hidden"><span id="score">Score : 0</span><span><span id="recHud"></span><br><span id="lives" class="heart"></span></span></div><div id="combo"></div>
<div id="menu" class="screen"><div class="panel"><h1>🍉 FRUIT SLICE</h1><p>Maintiens le clic et glisse pour trancher les fruits.<br>Plusieurs fruits dans le même geste = <b>COMBO</b>.<br>Un fruit raté = ❤️ -1. Ne coupe surtout pas les bombes 💣 !</p><div class="record">🏆 Record : <span id="recMenu">0</span></div><button id="start">⚔️ JOUER</button><p>Souris ou écran tactile</p></div></div>
<div id="over" class="screen hidden"><div class="panel"><h2>💥 GAME OVER</h2><p style="font-size:30px">Score : <b id="final">0</b></p><div class="record">🏆 Record : <span id="recOver">0</span></div><p id="newrec"></p><button id="replay">🔄 REJOUER</button><button id="home">🏠 MENU</button></div></div>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");let W,H,D,run=false,F=[],P=[],T=[],score=0,lives=3,spawn=0,last=0,slice=false,old=null,combo=0,record=+(localStorage.fruitSliceRecord||0);
const types=[["#35b954","#ef426f"],["#ff9619","#ffd04a"],["#f2dc32","#fff38a"],["#e84141","#f4e6b2"],["#f23d61","#ff91a5"],["#79552e","#82bd49"],["#ff9c7d","#ffd0a5"]];
function id(a){return document.getElementById(a)}function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener("resize",resize);resize();
function records(){id("recMenu").textContent=record;id("recOver").textContent=record;id("recHud").textContent="🏆 "+record}records();
class Fruit{constructor(b=false,o=0){this.b=b;this.r=28+Math.random()*18;this.x=W*.15+Math.random()*W*.7+o;this.y=H+60;let tx=W*.15+Math.random()*W*.7,d=1.35+Math.random()*.5;this.vx=(tx-this.x)/d;this.vy=-(Math.max(650,H*.9)+Math.random()*180);this.dead=false;this.t=types[Math.floor(Math.random()*types.length)]}update(dt){this.vy+=900*dt;this.x+=this.vx*dt;this.y+=this.vy*dt;if(this.y-this.r>H+30&&this.vy>0){this.dead=true;return !this.b}return false}draw(){x.save();x.translate(this.x,this.y);if(this.b){let g=x.createRadialGradient(-10,-12,2,0,0,this.r);g.addColorStop(0,"#777");g.addColorStop(1,"#050607");x.fillStyle=g;x.beginPath();x.arc(0,0,this.r,0,7);x.fill();x.strokeStyle="#8b5a2b";x.lineWidth=6;x.beginPath();x.moveTo(this.r*.4,-this.r*.7);x.lineTo(this.r,-this.r*1.2);x.stroke();x.fillStyle="#ffb000";x.shadowColor="#ff5000";x.shadowBlur=18;x.beginPath();x.arc(this.r,-this.r*1.2,8,0,7);x.fill()}else{let g=x.createRadialGradient(-12,-15,2,0,0,this.r);g.addColorStop(0,"#fff");g.addColorStop(.18,this.t[0]);g.addColorStop(1,"#111");x.fillStyle=g;x.beginPath();x.arc(0,0,this.r,0,7);x.fill();x.strokeStyle="#5d3b1c";x.lineWidth=5;x.beginPath();x.moveTo(0,-this.r*.85);x.lineTo(2,-this.r*1.15);x.stroke()}x.restore()}}
class Part{constructor(a,b,col,boom=false){let q=Math.random()*7,s=(boom?160:70)+Math.random()*(boom?420:250);this.x=a;this.y=b;this.vx=Math.cos(q)*s;this.vy=Math.sin(q)*s;this.life=.4+Math.random()*.5;this.m=this.life;this.r=2+Math.random()*7;this.c=col}update(dt){this.vy+=330*dt;this.x+=this.vx*dt;this.y+=this.vy*dt;this.life-=dt}draw(){x.globalAlpha=Math.max(0,this.life/this.m);x.fillStyle=this.c;x.beginPath();x.arc(this.x,this.y,this.r,0,7);x.fill();x.globalAlpha=1}}
function dist(px,py,a,b,d,e){let u=d-a,v=e-b;if(!u&&!v)return Math.hypot(px-a,py-b);let t=((px-a)*u+(py-b)*v)/(u*u+v*v);t=Math.max(0,Math.min(1,t));return Math.hypot(px-(a+t*u),py-(b+t*v))}
function bg(){let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,"#07151d");g.addColorStop(1,"#12302c");x.fillStyle=g;x.fillRect(0,0,W,H);x.strokeStyle="#ffffff0b";for(let a=-H;a<W;a+=120){x.beginPath();x.moveTo(a,0);x.lineTo(a+H,H);x.stroke()}}
function cut(f){f.dead=true;if(f.b){for(let i=0;i<70;i++)P.push(new Part(f.x,f.y,["#ff4b19","#ffc400","#777"][i%3],true));document.body.animate([{filter:"brightness(1)"},{filter:"brightness(4)"},{filter:"brightness(1)"}],{duration:250});end();return}score+=10;combo++;id("score").textContent="Score : "+score;for(let i=0;i<25;i++)P.push(new Part(f.x,f.y,f.t[1]))}
function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
c.onpointerdown=e=>{if(!run)return;slice=true;old=pos(e);combo=0;c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{if(!run||!slice)return;let p=pos(e);T.push({x:p.x,y:p.y,l:.18});if(old)for(let f of F)if(!f.dead&&dist(f.x,f.y,old.x,old.y,p.x,p.y)<=f.r)cut(f);old=p};
function stop(){if(combo>=2){let b=combo*combo*10;score+=b;id("score").textContent="Score : "+score;let q=id("combo");q.textContent="COMBO x"+combo+"  +"+b;q.classList.remove("pop");void q.offsetWidth;q.classList.add("pop")}slice=false;old=null;combo=0}c.onpointerup=stop;c.onpointercancel=stop;
function hearts(){id("lives").textContent="♥ ".repeat(Math.max(0,lives))}
function start(){F=[];P=[];T=[];score=0;lives=3;spawn=0;run=true;last=performance.now();id("score").textContent="Score : 0";hearts();id("menu").classList.add("hidden");id("over").classList.add("hidden");id("hud").classList.remove("hidden");requestAnimationFrame(loop)}
function end(){if(!run)return;run=false;let oldrec=record;if(score>record){record=score;localStorage.fruitSliceRecord=record}records();id("final").textContent=score;id("newrec").textContent=score>oldrec?"🎉 NOUVEAU RECORD !":"";setTimeout(()=>{id("hud").classList.add("hidden");id("over").classList.remove("hidden")},400)}
function loop(now){if(!run)return;let dt=Math.min((now-last)/1000,.035);last=now;spawn+=dt;let delay=Math.max(.28,.72-(1+score/500)*.035);if(spawn>=delay){spawn=0;let n=Math.random()<Math.min(.2+score/4000,.45)?2+Math.floor(Math.random()*2):1;for(let i=0;i<n;i++)F.push(new Fruit(Math.random()<Math.min(.1+score/5000,.18),(i-(n-1)/2)*45))}for(let f of F)if(!f.dead&&f.update(dt)){lives--;hearts();if(lives<=0){end();break}}F=F.filter(f=>!f.dead);P.forEach(p=>p.update(dt));P=P.filter(p=>p.life>0);T.forEach(t=>t.l-=dt);T=T.filter(t=>t.l>0);bg();F.forEach(f=>f.draw());P.forEach(p=>p.draw());if(T.length>1){x.lineCap="round";for(let i=1;i<T.length;i++){let a=T[i-1],b=T[i],al=Math.max(0,b.l/.18);x.strokeStyle="rgba(230,255,255,"+al+")";x.lineWidth=3+9*al;x.shadowColor="#bff";x.shadowBlur=12;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}x.shadowBlur=0}requestAnimationFrame(loop)}
id("start").onclick=start;id("replay").onclick=start;id("home").onclick=()=>{id("over").classList.add("hidden");id("menu").classList.remove("hidden")};bg();
</script></body></html>
