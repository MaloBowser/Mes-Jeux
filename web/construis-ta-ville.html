function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function updateWorldSize(){let size=GRID_SIZE*CELL()*cameraZoom;$("#world").style.width=size+"px";$("#world").style.height=size+"px"}
function setZoom(next,clientX=null,clientY=null){let vp=$("#viewport"),rect=vp.getBoundingClientRect(),localX=(clientX??rect.left+vp.clientWidth/2)-rect.left,localY=(clientY??rect.top+vp.clientHeight/2)-rect.top,worldX=(vp.scrollLeft+localX)/cameraZoom,worldY=(vp.scrollTop+localY)/cameraZoom;cameraZoom=clamp(next,.45,2.2);document.documentElement.style.setProperty("--zoom",cameraZoom);updateWorldSize();$("#zoomValue").textContent=Math.round(cameraZoom*100)+" %";vp.scrollLeft=worldX*cameraZoom-localX;vp.scrollTop=worldY*cameraZoom-localY;queueNatureRender()}
function centerOn(x,y){let vp=$("#viewport");vp.scrollTo({left:Math.max(0,x*CELL()*cameraZoom-vp.clientWidth/2),top:Math.max(0,y*CELL()*cameraZoom-vp.clientHeight/2),behavior:"smooth"})}
function setupCamera(){let vp=$("#viewport"),grid=$("#grid");updateWorldSize();$("#zoomOut").onclick=()=>setZoom(cameraZoom/1.2);$("#zoomIn").onclick=()=>setZoom(cameraZoom*1.2);$("#zoomReset").onclick=()=>setZoom(1);vp.addEventListener("scroll",queueNatureRender,{passive:true});vp.addEventListener("wheel",e=>{e.preventDefault();let delta=e.deltaMode===1?e.deltaY*16:e.deltaMode===2?e.deltaY*vp.clientHeight:e.deltaY;setZoom(cameraZoom*Math.exp(-delta*.0015),e.clientX,e.clientY)},{passive:false});vp.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||e.button!==0)return;cameraDrag={id:e.pointerId,x:e.clientX,y:e.clientY,left:vp.scrollLeft,top:vp.scrollTop,moved:false}});addEventListener("pointermove",e=>{if(!cameraDrag||e.pointerId!==cameraDrag.id)return;let dx=e.clientX-cameraDrag.x,dy=e.clientY-cameraDrag.y;if(!cameraDrag.moved&&Math.hypot(dx,dy)<6)return;cameraDrag.moved=true;vp.classList.add("panning");try{vp.setPointerCapture(e.pointerId)}catch(_){}vp.scrollLeft=cameraDrag.left-dx;vp.scrollTop=cameraDrag.top-dy;e.preventDefault()});addEventListener("pointerup",e=>{if(!cameraDrag||e.pointerId!==cameraDrag.id)return;if(cameraDrag.moved)suppressMapClickUntil=Date.now()+350;vp.classList.remove("panning");try{vp.releasePointerCapture(e.pointerId)}catch(_){}cameraDrag=null});vp.addEventListener("click",e=>{if(Date.now()<suppressMapClickUntil){e.preventDefault();e.stopImmediatePropagation()}},true);grid.addEventListener("click",e=>{if(!placement)return;e.preventDefault();e.stopImmediatePropagation();let rect=grid.getBoundingClientRect(),cellX=rect.width/GRID_SIZE,cellY=rect.height/GRID_SIZE,d=dims(placement.type,placement.rotation);placement.x=Math.max(0,Math.min(GRID_SIZE-d.w,Math.floor((e.clientX-rect.left)/cellX)));placement.y=Math.max(0,Math.min(GRID_SIZE-d.h,Math.floor((e.clientY-rect.top)/cellY)));renderGrid()},true);addEventListener("resize",updateWorldSize)}
let buildingClickTimer=0;
function setupBuildingDoubleClick(){let grid=$("#grid");grid.addEventListener("click",e=>{if(placement)return;let el=e.target.closest(".building");if(!el)return;e.preventDefault();e.stopImmediatePropagation();let building=state.batiments.find(b=>b.uid===el.dataset.uid);if(!building)return;clearTimeout(buildingClickTimer);if(e.detail>=2){closeModal();beginPlacement(building.type,building);notify("✥ Déplace le bâtiment puis valide avec OK.")}else buildingClickTimer=setTimeout(()=>openBuilding(building.uid),420)},true)}
init();setupCamera();setupBuildingDoubleClick();
</script>
</body></html>
