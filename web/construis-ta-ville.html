function exportSave(){saveGame();let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${slug(state.ville)||"ville"}-sauvegarde.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);notify("✅ Sauvegarde exportée.")}
async function importSave(file){try{let x=JSON.parse(await file.text());if(!validSave(x))throw 0;if(!confirm(`Importer la ville « ${x.ville} » ? La sauvegarde actuelle sera remplacée.`))return;state={...defaultState(),...x,settings:{...defaultState().settings,...x.settings}};localStorage.setItem(SAVE_KEY,JSON.stringify(state));location.reload()}catch(e){notify("❌ Fichier de sauvegarde invalide.",true)}}
function resetGame(){showModal(`<h2>🗑️ Supprimer la sauvegarde ?</h2><p>Cette action supprimera définitivement <b>${escapeHtml(state.ville)}</b>, tous ses bâtiments, ses chemins et ses pièces.</p><label for="deleteCityName">Écris exactement le nom de ta ville pour confirmer :</label><input id="deleteCityName" class="field" maxlength="30" autocomplete="off" placeholder="${escapeHtml(state.ville)}"><div class="modal-actions"><button type="button" id="deleteSaveNow" class="danger" disabled>🗑️ Supprimer définitivement</button><button type="button" id="cancelDelete">Annuler</button></div>`);let input=$("#deleteCityName"),button=$("#deleteSaveNow");input.oninput=()=>button.disabled=input.value.trim()!==state.ville;button.onclick=()=>{if(input.value.trim()!==state.ville)return;try{localStorage.removeItem(SAVE_KEY)}catch(e){return notify("❌ La sauvegarde n’a pas pu être supprimée.",true)}skipSaveOnUnload=true;state=defaultState();location.reload()};$("#cancelDelete").onclick=settings;input.focus()}
function showModal(html){closePanels();$("#modal").innerHTML=html;let deleteSave=$("#reset");if(deleteSave)deleteSave.textContent="🗑️ Supprimer la sauvegarde";$("#modalWrap").classList.add("open")};function closeModal(){selectedId=null;$("#modalWrap").classList.remove("open");renderGrid()};function notify(msg,error=false){let t=$("#toast");t.textContent=msg;t.style.borderColor=error?"var(--danger)":"var(--cyan)";t.classList.add("show");clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove("show"),2400)}function escapeHtml(s=""){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function centerOn(x,y){$("#viewport").scrollTo({left:Math.max(0,x*CELL()-100),top:Math.max(0,y*CELL()-100),behavior:"smooth"})}
function profile(){showModal(`<h2>🏙️ Crée ta ville</h2><p>Tu commences avec 1 000 pièces et un grand terrain vide.</p><label for="newPseudo">Ton pseudo</label><input id="newPseudo" class="field" maxlength="20" autocomplete="nickname"><label for="newCity">Nom de ta ville</label><input id="newCity" class="field" maxlength="30"><div class="modal-actions"><button id="create">Commencer l’aventure</button></div>`);$("#create").onclick=()=>{let p=$("#newPseudo").value.trim(),v=$("#newCity").value.trim();if(!p||!v)return notify("❌ Le pseudo et la ville sont obligatoires.",true);state.pseudo=p;state.ville=v;state.lastTick=Date.now();saveGame(true);closeModal();updateUI()}}
function offline(){let elapsed=Math.min(MAX_OFFLINE,Math.max(0,Date.now()-(+state.lastSave||Date.now()))),periods=Math.floor(elapsed/TICK),gain=periods*totalIncome();state.lastTick=Date.now();if(!gain)return;showModal(`<h2>👋 Bienvenue à nouveau, ${escapeHtml(state.pseudo)} !</h2><p>Pendant ton absence de ${Math.floor(elapsed/60000)} minute(s), ta ville a produit :</p><h2>+${fmt(gain)} 🪙</h2><div class="modal-actions"><button id="collect">Récolter</button></div>`);$("#collect").onclick=()=>{state.pieces+=gain;closeModal();saveGame(true);updateUI()}}
function init(){let cats=["Aménagement",...new Set(BATIMENTS.map(b=>b.categorie))];$("#category").innerHTML='<option value="">Toutes les catégories</option>'+cats.map(c=>`<option>${c}</option>`).join("");let loaded=loadGame();updateUI();if(!loaded||!state.pseudo||!state.ville)profile();else offline();$("#menuBtn").onclick=()=>{openPanel("#catalogPanel");renderCatalog()};$("#settingsBtn").onclick=settings;document.querySelectorAll(".closePanel").forEach(b=>b.onclick=closePanels);$("#search").oninput=renderCatalog;$("#category").onchange=renderCatalog;$("#leftBtn").onclick=()=>rotatePlacement(-1);$("#rightBtn").onclick=()=>rotatePlacement(1);$("#okBtn").onclick=validatePlacement;$("#cancelBtn").onclick=cancelPlacement;$("#moveBtn").onclick=()=>notify("✥ Clique une case du terrain ou utilise les flèches.");$("#grid").onclick=e=>{if(!placement)return;let r=$("#grid").getBoundingClientRect(),d=dims(placement.type,placement.rotation);placement.x=Math.max(0,Math.min(GRID_SIZE-d.w,Math.floor((e.clientX-r.left)/CELL())));placement.y=Math.max(0,Math.min(GRID_SIZE-d.h,Math.floor((e.clientY-r.top)/CELL())));renderGrid()};$("#importFile").onchange=e=>{if(e.target.files[0])importSave(e.target.files[0]);e.target.value=""};setInterval(produce,500);setInterval(moveCitizens,850);setInterval(()=>saveGame(false),1000);addEventListener("beforeunload",()=>{if(!skipSaveOnUnload)saveGame(false)});addEventListener("resize",renderGrid);addEventListener("keydown",e=>{if(["INPUT","SELECT"].includes(document.activeElement.tagName))return;if(e.key==="Escape"){if(placement)cancelPlacement();else if($("#modalWrap").classList.contains("open"))closeModal();else closePanels()}if(placement){if(e.key==="ArrowLeft")movePlacement(-1,0);if(e.key==="ArrowRight")movePlacement(1,0);if(e.key==="ArrowUp")movePlacement(0,-1);if(e.key==="ArrowDown")movePlacement(0,1);if(e.key.toLowerCase()==="r")rotatePlacement(e.shiftKey?-1:1);if(e.key.toLowerCase()==="l")rotatePlacement(-1);if(e.key==="Enter")validatePlacement()}else if(e.key==="Delete"&&selectedId)confirmSell(selectedId)})}
let cameraZoom=1,cameraDrag=null,suppressMapClickUntil=0;
function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function updateWorldSize(){let size=GRID_SIZE*CELL()*cameraZoom;$("#world").style.width=size+"px";$("#world").style.height=size+"px"}
function setZoom(next,clientX=null,clientY=null){let vp=$("#viewport"),rect=vp.getBoundingClientRect(),localX=(clientX??rect.left+vp.clientWidth/2)-rect.left,localY=(clientY??rect.top+vp.clientHeight/2)-rect.top,worldX=(vp.scrollLeft+localX)/cameraZoom,worldY=(vp.scrollTop+localY)/cameraZoom;cameraZoom=clamp(next,.45,2.2);document.documentElement.style.setProperty("--zoom",cameraZoom);updateWorldSize();$("#zoomValue").textContent=Math.round(cameraZoom*100)+" %";vp.scrollLeft=worldX*cameraZoom-localX;vp.scrollTop=worldY*cameraZoom-localY;queueNatureRender()}
function centerOn(x,y){let vp=$("#viewport");vp.scrollTo({left:Math.max(0,x*CELL()*cameraZoom-vp.clientWidth/2),top:Math.max(0,y*CELL()*cameraZoom-vp.clientHeight/2),behavior:"smooth"})}
function setupCamera(){
 let vp=$("#viewport"),grid=$("#grid");updateWorldSize();$("#zoomOut").onclick=()=>setZoom(cameraZoom/1.2);$("#zoomIn").onclick=()=>setZoom(cameraZoom*1.2);$("#zoomReset").onclick=()=>setZoom(1);vp.addEventListener("scroll",queueNatureRender,{passive:true});vp.addEventListener("wheel",e=>{e.preventDefault();let delta=e.deltaMode===1?e.deltaY*16:e.deltaMode===2?e.deltaY*vp.clientHeight:e.deltaY;setZoom(cameraZoom*Math.exp(-delta*.0015),e.clientX,e.clientY)},{passive:false});
 vp.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||e.button!==0||e.target.closest(".building"))return;cameraDrag={id:e.pointerId,x:e.clientX,y:e.clientY,left:vp.scrollLeft,top:vp.scrollTop,moved:false}});
 addEventListener("pointermove",e=>{if(!cameraDrag||e.pointerId!==cameraDrag.id)return;let dx=e.clientX-cameraDrag.x,dy=e.clientY-cameraDrag.y;if(!cameraDrag.moved&&Math.hypot(dx,dy)<6)return;cameraDrag.moved=true;vp.classList.add("panning");try{vp.setPointerCapture(e.pointerId)}catch(_){}vp.scrollLeft=cameraDrag.left-dx;vp.scrollTop=cameraDrag.top-dy;e.preventDefault()});
 addEventListener("pointerup",e=>{if(!cameraDrag||e.pointerId!==cameraDrag.id)return;if(cameraDrag.moved)suppressMapClickUntil=Date.now()+350;vp.classList.remove("panning");try{vp.releasePointerCapture(e.pointerId)}catch(_){}cameraDrag=null});vp.addEventListener("click",e=>{if(Date.now()<suppressMapClickUntil){e.preventDefault();e.stopImmediatePropagation()}},true);
 grid.addEventListener("click",e=>{if(!placement)return;e.preventDefault();e.stopImmediatePropagation();let rect=grid.getBoundingClientRect(),cellX=rect.width/GRID_SIZE,cellY=rect.height/GRID_SIZE,d=dims(placement.type,placement.rotation);placement.x=Math.max(0,Math.min(GRID_SIZE-d.w,Math.floor((e.clientX-rect.left)/cellX)));placement.y=Math.max(0,Math.min(GRID_SIZE-d.h,Math.floor((e.clientY-rect.top)/cellY)));renderGrid()},true);addEventListener("resize",updateWorldSize)
}
let buildingHold=null,suppressBuildingClickUntil=0;
function setupBuildingInteractions(){
 let grid=$("#grid");
 grid.addEventListener("pointerdown",e=>{if(placement||e.button!==0)return;let element=e.target.closest(".building");if(!element)return;let building=state.batiments.find(item=>item.uid===element.dataset.uid);if(!building)return;let rect=grid.getBoundingClientRect(),cellX=rect.width/GRID_SIZE,cellY=rect.height/GRID_SIZE,grabX=clamp(Math.floor((e.clientX-rect.left)/cellX)-building.x,0,1),grabY=clamp(Math.floor((e.clientY-rect.top)/cellY)-building.y,0,1);buildingHold={id:e.pointerId,building,startX:e.clientX,startY:e.clientY,grabX,grabY,active:false,cancelled:false,timer:setTimeout(()=>{if(!buildingHold||buildingHold.id!==e.pointerId||buildingHold.cancelled)return;buildingHold.active=true;suppressBuildingClickUntil=Date.now()+700;closeModal();beginPlacement(building.type,building,true);notify("✥ Maintiens et déplace, puis relâche pour poser.")},320)}},{passive:true});
 addEventListener("pointermove",e=>{if(!buildingHold||e.pointerId!==buildingHold.id)return;if(!buildingHold.active){if(Math.hypot(e.clientX-buildingHold.startX,e.clientY-buildingHold.startY)>10){buildingHold.cancelled=true;clearTimeout(buildingHold.timer)}return}if(!placement)return;let rect=grid.getBoundingClientRect(),cellX=rect.width/GRID_SIZE,cellY=rect.height/GRID_SIZE,d=dims(placement.type,placement.rotation),x=Math.max(0,Math.min(GRID_SIZE-d.w,Math.floor((e.clientX-rect.left)/cellX)-buildingHold.grabX)),y=Math.max(0,Math.min(GRID_SIZE-d.h,Math.floor((e.clientY-rect.top)/cellY)-buildingHold.grabY));if(x!==placement.x||y!==placement.y){placement.x=x;placement.y=y;renderGrid()}e.preventDefault()},{passive:false});
 addEventListener("pointerup",e=>{if(!buildingHold||e.pointerId!==buildingHold.id)return;clearTimeout(buildingHold.timer);let active=buildingHold.active,cancelled=buildingHold.cancelled;buildingHold=null;if(!active){if(cancelled){suppressBuildingClickUntil=Date.now()+400;e.preventDefault()}return}suppressBuildingClickUntil=Date.now()+700;suppressMapClickUntil=Date.now()+500;e.preventDefault();if(placement&&canPlace(placement.x,placement.y,placement.type,placement.rotation,placement.uid))validatePlacement();else{cancelPlacement();notify("↩️ Position occupée : déplacement annulé.",true)}},{passive:false});
 addEventListener("pointercancel",e=>{if(!buildingHold||e.pointerId!==buildingHold.id)return;clearTimeout(buildingHold.timer);let active=buildingHold.active;buildingHold=null;if(active&&placement)cancelPlacement()});
 grid.addEventListener("click",e=>{if(placement||Date.now()<suppressBuildingClickUntil)return;let element=e.target.closest(".building");if(!element)return;e.preventDefault();e.stopImmediatePropagation();let building=state.batiments.find(item=>item.uid===element.dataset.uid);if(building)openBuilding(building.uid)},true);
 grid.addEventListener("contextmenu",e=>{let element=e.target.closest(".building");if(!element)return;e.preventDefault();e.stopImmediatePropagation();if(placement)return;let building=state.batiments.find(item=>item.uid===element.dataset.uid);if(building)duplicateBuilding(building)},true)
}
init();setupCamera();setupBuildingInteractions();
